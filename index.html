<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BWショート動画作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Mochiy+Pop+One&family=Klee+One:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20211d;
    --paper:#f6f2e9;
    --paper-dim:#ece5d4;
    --gold:#c98f2b;
    --gold-deep:#96661a;
    --line:#d8cfb8;
    --ok:#3f6e4e;
    --err:#a83e3e;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.6;
    padding-bottom:80px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 40px;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:28px;
  }
  header.top h1{
    font-size:22px;
    font-weight:900;
    margin:0;
    letter-spacing:.02em;
  }
  header.top .tag{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--gold-deep);
  }

  .step{
    margin-bottom:36px;
  }
  .step-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .step-num{
    font-family:'Space Mono',monospace;
    font-size:13px;
    width:24px;height:24px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .step-num.done{background:var(--ink);color:var(--paper);}
  .step-title{font-size:16px;font-weight:700;}
  .step-sub{
    font-size:13px;
    color:#5c5847;
    margin:2px 0 0 34px;
  }
  .step-body{margin-left:34px;}

  .drop{
    display:flex;
    flex-direction:column;
    align-items:center;
    border:1.5px dashed var(--line);
    background:#fff;
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s;
  }
  .drop:hover, .drop.drag{border-color:var(--gold);}
  .drop input{display:none;}
  .drop .hint{font-size:13px;color:#5c5847;margin-top:6px;}

  .clip-list{display:flex;flex-direction:column;gap:14px;margin-top:16px;}
  .clip{
    background:#fff;
    border:1px solid var(--line);
    padding:14px;
    display:grid;
    grid-template-columns:108px 1fr;
    gap:12px;
  }
  .clip video{width:96px;height:128px;object-fit:cover;background:#000;}
  .clip-main{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .clip-title{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--gold-deep);
    display:flex;justify-content:space-between;
  }
  .clip-title button{
    background:none;border:none;color:#a83e3e;
    font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;
    padding:0;
  }
  .field-row{display:flex;flex-direction:column;gap:4px;}
  .field-row label{font-size:11px;color:#5c5847;}
  input[type="range"]{width:100%;accent-color:var(--gold);}
  input[type="text"]{
    width:100%;
    border:1px solid var(--line);
    padding:8px 9px;
    font-family:inherit;
    font-size:14px;
    background:var(--paper);
  }
  input[type="text"]:focus{outline:2px solid var(--gold);outline-offset:-1px;}
  .range-vals{font-family:'Space Mono',monospace;font-size:11px;color:#5c5847;}

  select{
    width:100%;
    border:1px solid var(--line);
    padding:8px 9px;
    font-family:inherit;
    font-size:14px;
    background:var(--paper);
    color:var(--ink);
  }
  select:focus{outline:2px solid var(--gold);outline-offset:-1px;}
  .telop-style-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:16px;
    background:#fff;
    border:1px solid var(--line);
    padding:14px;
  }
  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
  .swatch{
    width:34px;height:34px;
    border-radius:50%;
    border:2px solid var(--line);
    cursor:pointer;
    padding:0;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .swatch.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink);}
  .swatch-x{font-size:16px;color:#8a8368;line-height:1;}

  .bgm-row{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);padding:12px 14px;
  }
  .bgm-row .name{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bgm-row input[type="range"]{width:100px;}
  .btn-ghost{
    border:1px solid var(--ink);background:none;color:var(--ink);
    padding:7px 14px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  .btn-ghost:hover{background:var(--ink);color:var(--paper);}

  .primary-bar{
    position:sticky;bottom:0;
    background:var(--paper);
    border-top:2px solid var(--ink);
    padding:14px 20px;
    margin:0 -20px;
  }
  .primary-bar-inner{max-width:640px;margin:0 auto;}
  .btn-main{
    width:100%;
    background:var(--ink);color:var(--paper);
    border:none;padding:15px;
    font-family:inherit;font-size:15px;font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .btn-main:disabled{background:#a49d87;cursor:not-allowed;}
  .status-line{
    font-family:'Space Mono',monospace;
    font-size:12px;color:#5c5847;
    margin-top:8px;
    min-height:16px;
  }
  .progress{
    height:4px;background:var(--paper-dim);margin-top:6px;overflow:hidden;
  }
  .progress > div{height:100%;background:var(--gold);width:0%;transition:width .2s;}

  .result{
    margin-top:20px;
    text-align:center;
  }
  .result video{
    width:100%;max-width:280px;
    border:1px solid var(--ink);
    background:#000;
  }
  .result a.dl, .result button.dl{
    display:inline-block;margin-top:12px;
    background:var(--gold-deep);color:#fff;
    padding:11px 22px;text-decoration:none;
    font-size:14px;font-weight:700;
    border:none;font-family:inherit;cursor:pointer;
  }

  .total-dur{
    font-family:'Space Mono',monospace;
    font-size:12px;
    margin-top:10px;
    color:#5c5847;
  }
  .total-dur.warn{color:var(--err);}
  .total-dur.ok{color:var(--ok);}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>BWショート動画作成</h1>
  </header>

  <div class="step">
    <div class="step-head">
      <div class="step-num" id="num1">1</div>
      <div class="step-title">動画を選ぶ（3〜5本）</div>
    </div>
    <div class="step-sub">商品を複数アングルで撮影した3〜10秒以内の動画を選んでください</div>
    <div class="step-body">
      <label class="drop" id="drop">
        <input type="file" id="fileInput" accept="video/*" multiple>
        <div>タップして動画を選択</div>
        <div class="hint">またはここにドラッグ＆ドロップ</div>
      </label>

      <div class="clip-list" id="clipList"></div>
      <div class="total-dur" id="totalDur"></div>

      <div class="telop-style-row">
        <div class="field-row">
          <label>テロップの書体</label>
          <select id="telopFontSelect">
            <option value="'Zen Kaku Gothic New', sans-serif">ゴシック体</option>
            <option value="'Zen Old Mincho', serif">明朝体</option>
            <option value="'Zen Maru Gothic', sans-serif">丸ゴシック</option>
            <option value="'Mochiy Pop One', sans-serif">ポップ体</option>
            <option value="'Klee One', cursive">手書き風</option>
          </select>
        </div>
        <div class="field-row">
          <label>テロップの大きさ：<span id="telopSizeLabel">3</span></label>
          <input type="range" id="telopSizeRange" min="1" max="10" step="1" value="3">
        </div>
        <div class="field-row" style="grid-column:1 / -1;">
          <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="telopBgToggle" checked> テロップに背景をつける
          </label>
        </div>
        <div class="field-row" style="grid-column:1 / -1;">
          <label>文字の縁取り</label>
          <div class="swatch-row" id="outlineSwatches">
            <button type="button" class="swatch active" data-color="none" title="なし"><span class="swatch-x">×</span></button>
            <button type="button" class="swatch" data-color="#000000" style="background:#000000;" title="黒"></button>
            <button type="button" class="swatch" data-color="#c98f2b" style="background:#c98f2b;" title="ゴールド"></button>
            <button type="button" class="swatch" data-color="#c0392b" style="background:#c0392b;" title="レッド"></button>
            <button type="button" class="swatch" data-color="#2b5fc0" style="background:#2b5fc0;" title="ブルー"></button>
            <button type="button" class="swatch" data-color="#2f7d4f" style="background:#2f7d4f;" title="グリーン"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="step">
    <div class="step-head">
      <div class="step-num" id="num2">2</div>
      <div class="step-title">音声</div>
    </div>
    <div class="step-sub">動画本来の音を使うか選んでください</div>
    <div class="step-body">
      <div class="bgm-row" style="margin-bottom:12px;">
        <span class="name">動画本来の音を使う</span>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="origAudioToggle">ON
        </label>
      </div>
      <div class="field-row">
        <label>音量：<span class="range-vals" id="audioVolLabel">100%</span></label>
        <input type="range" id="audioVol" min="0" max="100" value="100">
      </div>
    </div>
  </div>

  <div class="step">
    <div class="step-head">
      <div class="step-num" id="num3">3</div>
      <div class="step-title">結合して書き出し</div>
    </div>
    <div class="step-sub">縦型動画を作成します（長さはアップロードした動画に応じて変わります）</div>
    <div class="step-body">
      <div class="field-row" style="margin-bottom:16px;">
        <label>画質</label>
        <select id="qualitySelect">
          <option value="high">高画質（1080×1920・容量大）</option>
          <option value="standard" selected>標準（720×1280・おすすめ）</option>
          <option value="light">軽量（540×960・容量小）</option>
        </select>
      </div>
      <div id="resultArea"></div>
    </div>
  </div>

</div>

<div class="primary-bar">
  <div class="primary-bar-inner">
    <button class="btn-main" id="buildBtn" disabled>動画をアップロードしてください</button>
    <div class="status-line" id="statusLine"></div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

let OUT_W = 1080, OUT_H = 1920;
const QUALITY_PRESETS = {
  high: { w: 1080, h: 1920 },
  standard: { w: 720, h: 1280 },
  light: { w: 540, h: 960 },
};
const TARGET_TOTAL = 15; // seconds, guideline only

let clips = []; // {id, file, url, srcDuration, start, dur, telop}
let ffmpeg = null;
let ffmpegReady = false;

const clipList = document.getElementById('clipList');
const fileInput = document.getElementById('fileInput');
const drop = document.getElementById('drop');
const totalDurEl = document.getElementById('totalDur');
const buildBtn = document.getElementById('buildBtn');
const statusLine = document.getElementById('statusLine');
const progressBar = document.getElementById('progressBar');
const resultArea = document.getElementById('resultArea');

const origAudioToggle = document.getElementById('origAudioToggle');
const telopFontSelect = document.getElementById('telopFontSelect');
const telopSizeRange = document.getElementById('telopSizeRange');
const telopSizeLabel = document.getElementById('telopSizeLabel');
const telopBgToggle = document.getElementById('telopBgToggle');
telopSizeRange.addEventListener('input', () => {
  telopSizeLabel.textContent = telopSizeRange.value;
  refreshAllCaptionPreviews();
});
telopFontSelect.addEventListener('change', refreshAllCaptionPreviews);
telopBgToggle.addEventListener('change', refreshAllCaptionPreviews);

let telopOutlineColor = 'none';
const outlineSwatches = document.getElementById('outlineSwatches');
outlineSwatches.querySelectorAll('.swatch').forEach(btn => {
  btn.addEventListener('click', () => {
    telopOutlineColor = btn.dataset.color;
    outlineSwatches.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    refreshAllCaptionPreviews();
  });
});

const audioVolInput = document.getElementById('audioVol');
const audioVolLabel = document.getElementById('audioVolLabel');
audioVolInput.addEventListener('input', () => {
  audioVolLabel.textContent = audioVolInput.value + '%';
});

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(fileListLike) {
  const files = Array.from(fileListLike).filter(f => f.type.startsWith('video/'));
  for (const f of files) {
    if (clips.length >= 5) break;
    const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const url = URL.createObjectURL(f);
    const clip = { id, file: f, url, srcDuration: 0, start: 0, dur: 3, telop: '', analyzing: true };
    clips.push(clip);
    analyzeClip(clip).then(() => {
      clip.analyzing = false;
      renderClips();
    }).catch(() => {
      clip.analyzing = false;
      clip.dur = Math.min(clip.srcDuration || 3, 4);
      clip.start = 0;
      renderClips();
    });
  }
  fileInput.value = '';
  renderClips();
}

// ---- Auto-trim: pick a stable, low-motion window without any manual UI ----
function seekTo(video, t) {
  return new Promise((resolve) => {
    const onSeeked = () => { video.removeEventListener('seeked', onSeeked); resolve(); };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

// Some phone-recorded videos (certain codecs/containers) report an invalid
// duration (Infinity or NaN) until the browser is forced to recompute it.
// This is a known workaround: seek far past the end once, then back to 0.
function getReliableDuration(video) {
  if (isFinite(video.duration) && video.duration > 0) {
    return Promise.resolve(video.duration);
  }
  return new Promise((resolve) => {
    const onUpdate = () => {
      video.removeEventListener('timeupdate', onUpdate);
      video.currentTime = 0;
      resolve(isFinite(video.duration) && video.duration > 0 ? video.duration : 0);
    };
    video.addEventListener('timeupdate', onUpdate);
    video.currentTime = 1e101;
    // Safety net: some browsers never fire timeupdate for this trick.
    setTimeout(() => { onUpdate(); }, 3000);
  });
}

const ANALYZE_TIMEOUT_MS = 45000;

async function analyzeClip(clip) {
  await Promise.race([
    analyzeClipInner(clip),
    new Promise((_, reject) => setTimeout(() => reject(new Error('analyze timeout')), ANALYZE_TIMEOUT_MS)),
  ]);
}

async function analyzeClipInner(clip) {
  const video = document.createElement('video');
  video.src = clip.url;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = resolve;
    video.onerror = () => reject(new Error('load failed'));
  });

  // iOS (Safari engine, including "Chrome" on iPhone) often won't decode
  // real frames — for canvas drawing OR for accurate duration/seek info —
  // until playback has actually started at least once. A brief muted
  // play+pause "wakes up" the decoder before we rely on seeking.
  try {
    await video.play();
    video.pause();
    video.currentTime = 0;
  } catch (e) { /* ignore — some browsers don't need this */ }

  const duration = await getReliableDuration(video);
  if (!duration || !isFinite(duration)) {
    // Couldn't determine a real length — fall back to a safe, fixed clip
    // rather than risk an endless search over an unknown/huge range.
    clip.srcDuration = 0;
    clip.start = 0;
    clip.dur = 4;
  } else {
    clip.srcDuration = duration;

    // Trim off the shaky first/last 0.5s (raising/lowering the camera),
    // then use the rest as-is. (No extra length cap here — staff are
    // instructed to upload 3-10s clips already.)
    const pad = 0.5;
    let innerStart = 0, innerEnd = duration;
    if (duration > pad * 2 + 0.4) { innerStart = pad; innerEnd = duration - pad; }
    const usable = Math.max(innerEnd - innerStart, 0.3);
    clip.start = innerStart;
    clip.dur = usable;
  }

  // Thumbnail: draw a seeked frame to canvas rather than relying on the
  // <video> element to paint one itself (unreliable on mobile — often
  // shows solid black until playback actually starts).
  try {
    const seekAt = Math.min(clip.start + 0.15, Math.max((clip.srcDuration || 1) - 0.05, 0));
    const tCanvas = document.createElement('canvas');
    tCanvas.width = 108; tCanvas.height = 192;
    const tctx = tCanvas.getContext('2d');

    const drawOnce = async (t) => {
      await seekTo(video, t);
      // Give iOS a couple of frames to actually paint the seeked position
      // before we read it — seeking fires "seeked" slightly before the
      // frame is really ready to be drawn on some iOS versions.
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      const vw = video.videoWidth || 96, vh = video.videoHeight || 128;
      const dscale = Math.max(tCanvas.width / vw, tCanvas.height / vh);
      const dw = vw * dscale, dh = vh * dscale;
      tctx.clearRect(0, 0, tCanvas.width, tCanvas.height);
      tctx.drawImage(video, (tCanvas.width - dw) / 2, (tCanvas.height - dh) / 2, dw, dh);
      const sample = tctx.getImageData(tCanvas.width / 2 - 5, tCanvas.height / 2 - 5, 10, 10).data;
      let sum = 0;
      for (let i = 0; i < sample.length; i += 4) sum += sample[i] + sample[i + 1] + sample[i + 2];
      return sum; // near-zero means the frame is (still) solid black
    };

    let brightness = await drawOnce(seekAt);
    if (brightness < 5) {
      // Looked black — retry once a little further into the clip.
      brightness = await drawOnce(Math.min(seekAt + 0.4, Math.max((clip.srcDuration || 1) - 0.05, 0)));
    }
    clip.thumbUrl = tCanvas.toDataURL('image/jpeg', 0.8);
  } catch (e) { /* thumbnail is a nice-to-have; ignore failures */ }
}


function renderClips() {
  clipList.innerHTML = '';
  clips.forEach((clip, idx) => {
    const row = document.createElement('div');
    row.className = 'clip';
    const durText = clip.analyzing
      ? '解析中…'
      : `アップロードした動画の長さ：${clip.srcDuration.toFixed(1)}秒`;
    const thumbInner = clip.thumbUrl
      ? `<img src="${clip.thumbUrl}" alt="" style="width:100%;height:100%;object-fit:cover;background:#000;display:block;">`
      : `<div style="width:100%;height:100%;background:#000;"></div>`;
    const capPreviewSrc = generateCaptionDataURL(clip.telop);
    row.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
        <div style="position:relative;width:108px;height:192px;overflow:hidden;">
          ${thumbInner}
          <img data-cappreview="${clip.id}" src="${capPreviewSrc || ''}" alt=""
               style="position:absolute;left:0;top:37%;width:100%;transform:translateY(-50%);pointer-events:none;${capPreviewSrc ? '' : 'display:none;'}">
        </div>
        <div style="display:flex;gap:4px;">
          <button class="btn-ghost" style="padding:3px 8px;font-size:11px;" data-move-up="${clip.id}" ${idx === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn-ghost" style="padding:3px 8px;font-size:11px;" data-move-down="${clip.id}" ${idx === clips.length - 1 ? 'disabled' : ''}>↓</button>
        </div>
      </div>
      <div class="clip-main">
        <div class="clip-title">
          <span>CLIP ${String(idx + 1).padStart(2, '0')}</span>
          <button data-remove="${clip.id}">削除</button>
        </div>
        <div class="field-row">
          <label>テロップ文言</label>
          <input type="text" maxlength="40" placeholder="例）おススメソファー" data-telop="${clip.id}" value="${clip.telop}">
        </div>
        <div class="range-vals">${durText}</div>
      </div>
    `;
    clipList.appendChild(row);
  });

  clipList.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      clips = clips.filter(c => c.id !== btn.dataset.remove);
      renderClips();
    });
  });
  clipList.querySelectorAll('[data-move-up]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = clips.findIndex(c => c.id === btn.dataset.moveUp);
      if (i > 0) { [clips[i - 1], clips[i]] = [clips[i], clips[i - 1]]; renderClips(); }
    });
  });
  clipList.querySelectorAll('[data-move-down]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = clips.findIndex(c => c.id === btn.dataset.moveDown);
      if (i >= 0 && i < clips.length - 1) { [clips[i + 1], clips[i]] = [clips[i], clips[i + 1]]; renderClips(); }
    });
  });
  clipList.querySelectorAll('[data-telop]').forEach(inp => {
    inp.addEventListener('input', () => {
      const c = clips.find(c => c.id === inp.dataset.telop);
      if (c) c.telop = inp.value;
      const imgEl = clipList.querySelector(`[data-cappreview="${inp.dataset.telop}"]`);
      if (imgEl) {
        const src = generateCaptionDataURL(inp.value);
        if (src) { imgEl.src = src; imgEl.style.display = ''; }
        else { imgEl.style.display = 'none'; }
      }
    });
  });

  updateTotal();
  updateStep1Badge();
}

// Renders a caption at a small fixed reference width for the in-list
// preview — independent of the actual export resolution/quality setting.
function generateCaptionDataURL(text) {
  if (!text || !text.trim()) return null;
  const font = telopFontSelect.value;
  const size = parseInt(telopSizeRange.value, 10);
  const bgOn = telopBgToggle.checked;
  const canvas = makeCaptionPNG(text.trim(), font, size, bgOn, telopOutlineColor, 1080);
  return canvas.toDataURL('image/png');
}

// Called whenever a global telop style setting changes (font/size/bg/outline)
// so every clip's preview reflects it immediately.
function refreshAllCaptionPreviews() {
  clips.forEach(c => {
    const imgEl = clipList.querySelector(`[data-cappreview="${c.id}"]`);
    if (!imgEl) return;
    const src = generateCaptionDataURL(c.telop);
    if (src) { imgEl.src = src; imgEl.style.display = ''; }
    else { imgEl.style.display = 'none'; }
  });
}

function updateTotal() {
  if (clips.length === 0) { totalDurEl.textContent = ''; buildBtn.disabled = true; buildBtn.textContent = '動画をアップロードしてください'; return; }
  const stillAnalyzing = clips.some(c => c.analyzing);
  const total = clips.reduce((s, c) => s + (c.dur || 0), 0);
  totalDurEl.textContent = stillAnalyzing ? '動画を解析しています…' : `使用予定の合計 約${total.toFixed(1)}秒`;
  const enoughClips = clips.length >= 3 && clips.length <= 5;
  buildBtn.disabled = !enoughClips || stillAnalyzing;
  buildBtn.textContent = stillAnalyzing
    ? '動画を解析しています…'
    : (enoughClips ? '動画を作成する' : 'あと' + (3 - clips.length) + '本、動画を追加してください');
}

function updateStep1Badge() {
  document.getElementById('num1').classList.toggle('done', clips.length >= 3);
}

// ---- Caption image generation (Canvas -> PNG) ----
const TELOP_SIZE_PX = { 1: 38, 2: 48, 3: 58, 4: 70, 5: 84, 6: 100, 7: 118, 8: 138, 9: 160, 10: 184 };
const TELOP_MAX_LINES = 3;

function wrapCaptionText(ctx, text, maxWidth) {
  const hasSpaces = /\s/.test(text);
  const units = hasSpaces ? text.split(/\s+/) : Array.from(text);
  const sep = hasSpaces ? ' ' : '';
  const lines = [];
  let cur = '';
  for (const u of units) {
    const test = cur ? cur + sep + u : u;
    if (ctx.measureText(test).width > maxWidth && cur) {
      lines.push(cur);
      cur = u;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, TELOP_MAX_LINES);
}

function makeCaptionPNG(text, fontFamily, sizeLevel, bgOn, outlineColor, refW = OUT_W) {
  const scale = refW / 1080;
  const fontPx = Math.round((TELOP_SIZE_PX[sizeLevel] || TELOP_SIZE_PX[3]) * scale);
  const lineHeight = Math.round(fontPx * 1.28);
  const padX = Math.round(48 * scale), padY = Math.round(22 * scale);
  const maxTextWidth = refW - 80 * scale - padX * 2;

  // Measure on a scratch canvas first so we know how tall the final canvas
  // needs to be (depends on how many lines the text wraps to).
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = `700 ${fontPx}px ${fontFamily}`;
  const lines = text ? wrapCaptionText(mctx, text, maxTextWidth) : [];

  const boxH = lines.length ? lines.length * lineHeight + padY * 2 : 0;
  const canvasH = Math.max(boxH + 20, 40); // small margin so text/outline isn't clipped
  const canvas = document.createElement('canvas');
  canvas.width = refW;
  canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!lines.length) return canvas;

  ctx.font = `700 ${fontPx}px ${fontFamily}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  let maxLineWidth = 0;
  for (const l of lines) maxLineWidth = Math.max(maxLineWidth, ctx.measureText(l).width);
  const boxW = Math.min(canvas.width - 80 * scale, maxLineWidth + padX * 2);

  if (bgOn) {
    ctx.fillStyle = 'rgba(20,19,15,0.5)';
    roundRect(ctx, cx - boxW / 2, cy - boxH / 2, boxW, boxH, 6);
    ctx.fill();
  }

  ctx.font = `700 ${fontPx}px ${fontFamily}`;
  const firstLineY = cy - ((lines.length - 1) * lineHeight) / 2;
  const hasOutline = outlineColor && outlineColor !== 'none';
  if (hasOutline) {
    ctx.strokeStyle = outlineColor;
    ctx.lineWidth = Math.max(2, Math.round(fontPx * 0.12));
  }
  ctx.fillStyle = '#ffffff';
  lines.forEach((line, idx) => {
    const y = firstLineY + idx * lineHeight + 2;
    if (hasOutline) ctx.strokeText(line, cx, y);
    ctx.fillText(line, cx, y);
  });

  return canvas;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function canvasToPNGBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// Fetch a URL with byte-level progress and a stall timeout (aborts if no
// new bytes arrive for STALL_MS, so the UI never hangs silently).
const STALL_MS = 25000;
async function fetchWithProgress(url, mimeType, label, onProgress) {
  const controller = new AbortController();
  let stallTimer = null;
  const resetStallTimer = () => {
    clearTimeout(stallTimer);
    stallTimer = setTimeout(() => controller.abort(), STALL_MS);
  };
  resetStallTimer();

  let res;
  try {
    res = await fetch(url, { signal: controller.signal });
  } catch (e) {
    clearTimeout(stallTimer);
    throw new Error(`${label} に接続できませんでした。通信環境をご確認ください。（${url}）`);
  }
  if (!res.ok) {
    clearTimeout(stallTimer);
    throw new Error(`${label} の取得に失敗しました（HTTP ${res.status}）。時間をおいて再度お試しください。`);
  }

  const total = Number(res.headers.get('Content-Length')) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      resetStallTimer();
      onProgress(received, total);
    }
  } catch (e) {
    throw new Error(`${label} のダウンロードが途中で止まりました。通信環境をご確認のうえ再度お試しください。`);
  } finally {
    clearTimeout(stallTimer);
  }
  return new Blob(chunks, { type: mimeType });
}

function fmtMB(bytes) { return (bytes / (1024 * 1024)).toFixed(1); }

// ---- FFmpeg setup ----
async function ensureFFmpeg() {
  if (ffmpegReady) return;
  ffmpeg = new FFmpeg();
  ffmpeg.on('log', ({ message }) => { /* console.log(message); */ });
  ffmpeg.on('progress', ({ progress }) => {
    progressBar.style.width = Math.min(100, Math.round(progress * 100)) + '%';
  });

  const coreBaseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';

  const files = [
    { url: `${coreBaseURL}/ffmpeg-core.js`, mime: 'text/javascript', label: '動画エンジン(1/2)' },
    { url: `${coreBaseURL}/ffmpeg-core.wasm`, mime: 'application/wasm', label: '動画エンジン(2/2・本体約30MB)' },
  ];
  const blobUrls = [];
  for (const f of files) {
    const blob = await fetchWithProgress(f.url, f.mime, f.label, (received, total) => {
      const recvMB = fmtMB(received);
      const totalMB = total ? fmtMB(total) : '?';
      statusLine.textContent = `初回のみ：${f.label}を読み込み中… (${recvMB}MB / ${totalMB}MB)`;
      if (total) progressBar.style.width = Math.min(100, Math.round((received / total) * 100)) + '%';
    });
    blobUrls.push(URL.createObjectURL(blob));
  }

  // classWorkerURL must be same-origin (not a blob of the CDN's worker.js):
  // that worker.js does `import ... from "./const.js"`, and relative imports
  // cannot resolve from inside a blob: URL, which caused a silent, un-erroring
  // hang. We host our own copy of worker.js (+ const.js/errors.js) alongside
  // this page so those relative imports resolve normally over real HTTP.
  const classWorkerURL = new URL('vendor/worker.js', location.href).href;

  statusLine.textContent = '動画エンジンを起動中…';
  const startupTimer = setTimeout(() => {
    statusLine.textContent = '起動に時間がかかっています…（このまま数十秒お待ちください）';
  }, 8000);
  try {
    await Promise.race([
      ffmpeg.load({
        coreURL: blobUrls[0],
        wasmURL: blobUrls[1],
        classWorkerURL,
      }),
      new Promise((_, reject) => setTimeout(
        () => reject(new Error('動画エンジンの起動が60秒たっても完了しませんでした。ページを再読み込みして、もう一度お試しください。')),
        60000
      )),
    ]);
  } finally {
    clearTimeout(startupTimer);
  }
  ffmpegReady = true;
}


buildBtn.addEventListener('click', runBuild);

async function runBuild() {
  buildBtn.disabled = true;
  resultArea.innerHTML = '';
  progressBar.style.width = '0%';
  const preset = QUALITY_PRESETS[document.getElementById('qualitySelect').value] || QUALITY_PRESETS.standard;
  OUT_W = preset.w;
  OUT_H = preset.h;
  try {
    await ensureFFmpeg();

    // Write source clips
    for (let i = 0; i < clips.length; i++) {
      statusLine.textContent = `素材を準備中… (${i + 1}/${clips.length})`;
      const c = clips[i];
      const data = await fetchFile(c.file);
      await ffmpeg.writeFile(`src${i}.mp4`, data);
    }

    // Write caption PNGs
    const chosenFont = telopFontSelect.value;
    const chosenSize = parseInt(telopSizeRange.value, 10);
    const chosenBgOn = telopBgToggle.checked;
    const chosenOutline = telopOutlineColor;
    try {
      await document.fonts.load(`700 ${TELOP_SIZE_PX[chosenSize]}px ${chosenFont}`);
      await document.fonts.ready;
    } catch (e) { /* fall back to default rendering if font load fails */ }

    const captionFiles = [];
    for (let i = 0; i < clips.length; i++) {
      const c = clips[i];
      if (c.telop && c.telop.trim()) {
        const canvas = makeCaptionPNG(c.telop.trim(), chosenFont, chosenSize, chosenBgOn, chosenOutline);
        c.capHeight = canvas.height;
        const blob = await canvasToPNGBlob(canvas);
        const buf = new Uint8Array(await blob.arrayBuffer());
        await ffmpeg.writeFile(`cap${i}.png`, buf);
        captionFiles.push(i);
      }
    }

    // Build each clip as ONE combined segment (video+caption+audio together,
    // using the identical -ss/-t for both streams in a single ffmpeg call).
    // Doing video and audio as separate passes previously caused a slight
    // per-clip drift that accumulated into audio/video falling out of sync.
    statusLine.textContent = '各カットを整形中…';
    const TELOP_CENTER_FRACTION = 0.37;
    const useOrigAudio = origAudioToggle.checked;
    const segmentFiles = [];
    for (let i = 0; i < clips.length; i++) {
      const c = clips[i];
      const outName = `seg${i}.mp4`;
      const args = [
        '-ss', String(c.start),
        '-i', `src${i}.mp4`,
        '-t', String(c.dur),
      ];
      let filter = `[0:v]scale=${OUT_W}:${OUT_H}:force_original_aspect_ratio=increase,crop=${OUT_W}:${OUT_H},setsar=1,fps=30[base]`;
      if (captionFiles.includes(i)) {
        args.push('-i', `cap${i}.png`);
        const capH = c.capHeight || 100;
        const capY = Math.round(OUT_H * TELOP_CENTER_FRACTION - capH / 2);
        filter += `;[base][1:v]overlay=0:${capY}[v]`;
      } else {
        filter += `;[base]null[v]`;
      }
      args.push('-filter_complex', filter, '-map', '[v]');
      if (useOrigAudio) {
        args.push('-map', '0:a:0?', '-c:a', 'aac', '-ar', '44100', '-ac', '2');
      } else {
        args.push('-an');
      }
      args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-pix_fmt', 'yuv420p', outName);
      await ffmpeg.exec(args);
      segmentFiles.push(outName);
    }

    // Concat all segments (video, and audio if present) in one pass.
    statusLine.textContent = 'カットをつなげています…';
    const listContent = segmentFiles.map(f => `file '${f}'`).join('\n');
    await ffmpeg.writeFile('list.txt', new TextEncoder().encode(listContent));
    await ffmpeg.exec(['-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'combined.mp4']);

    // Apply the volume setting to the original audio (if it's on).
    statusLine.textContent = '書き出し中…';
    if (useOrigAudio) {
      const vol = audioVolInput.value / 100;
      await ffmpeg.exec([
        '-i', 'combined.mp4',
        '-filter:a', `volume=${vol}`,
        '-map', '0:v', '-map', '0:a',
        '-c:v', 'copy', '-c:a', 'aac', '-b:a', '128k', 'output.mp4',
      ]);
    } else {
      await ffmpeg.exec(['-i', 'combined.mp4', '-c', 'copy', 'output.mp4']);
    }

    const outData = await ffmpeg.readFile('output.mp4');
    const blob = new Blob([outData.buffer], { type: 'video/mp4' });
    const outUrl = URL.createObjectURL(blob);
    const shareFile = new File([outData.buffer], 'reel.mp4', { type: 'video/mp4' });
    const canShareFile = !!(navigator.canShare && navigator.canShare({ files: [shareFile] }));

    resultArea.innerHTML = `
      <div class="result">
        <video src="${outUrl}" controls playsinline></video><br>
        ${canShareFile ? '<button class="dl" id="shareBtn" type="button">Instagramなどで共有</button><br><br>' : ''}
        <a class="dl" href="${outUrl}" download="reel.mp4" style="background:var(--ink);">動画をダウンロード</a>
      </div>
    `;
    if (canShareFile) {
      document.getElementById('shareBtn').addEventListener('click', async () => {
        try {
          await navigator.share({ files: [shareFile], title: 'リール動画' });
        } catch (e) {
          // User cancelled the share sheet, or the browser rejected it — no need to show an error for this.
        }
      });
    }
    statusLine.textContent = canShareFile
      ? '完成しました。「Instagramなどで共有」から直接送るか、ダウンロードしてください。'
      : '完成しました。ダウンロードしてInstagramにアップロードしてください。';
    progressBar.style.width = '100%';
  } catch (err) {
    console.error(err);
    statusLine.textContent = 'エラーが発生しました: ' + (err && err.message ? err.message : String(err));
  } finally {
    buildBtn.disabled = false;
  }
}

renderClips();
</script>
