<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品リール作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20211d;
    --paper:#f6f2e9;
    --paper-dim:#ece5d4;
    --gold:#c98f2b;
    --gold-deep:#96661a;
    --line:#d8cfb8;
    --ok:#3f6e4e;
    --err:#a83e3e;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.6;
    padding-bottom:80px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 40px;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:28px;
  }
  header.top h1{
    font-size:22px;
    font-weight:900;
    margin:0;
    letter-spacing:.02em;
  }
  header.top .tag{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--gold-deep);
  }

  .step{
    margin-bottom:36px;
  }
  .step-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .step-num{
    font-family:'Space Mono',monospace;
    font-size:13px;
    width:24px;height:24px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .step-num.done{background:var(--ink);color:var(--paper);}
  .step-title{font-size:16px;font-weight:700;}
  .step-sub{
    font-size:13px;
    color:#5c5847;
    margin:2px 0 0 34px;
  }
  .step-body{margin-left:34px;}

  .drop{
    border:1.5px dashed var(--line);
    background:#fff;
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s;
  }
  .drop:hover, .drop.drag{border-color:var(--gold);}
  .drop input{display:none;}
  .drop .hint{font-size:13px;color:#5c5847;margin-top:6px;}

  .clip-list{display:flex;flex-direction:column;gap:14px;margin-top:16px;}
  .clip{
    background:#fff;
    border:1px solid var(--line);
    padding:14px;
    display:grid;
    grid-template-columns:96px 1fr;
    gap:12px;
  }
  .clip video{width:96px;height:128px;object-fit:cover;background:#000;}
  .clip-main{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .clip-title{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--gold-deep);
    display:flex;justify-content:space-between;
  }
  .clip-title button{
    background:none;border:none;color:#a83e3e;
    font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;
    padding:0;
  }
  .field-row{display:flex;flex-direction:column;gap:4px;}
  .field-row label{font-size:11px;color:#5c5847;}
  input[type="range"]{width:100%;accent-color:var(--gold);}
  input[type="text"]{
    width:100%;
    border:1px solid var(--line);
    padding:8px 9px;
    font-family:inherit;
    font-size:14px;
    background:var(--paper);
  }
  input[type="text"]:focus{outline:2px solid var(--gold);outline-offset:-1px;}
  .range-vals{font-family:'Space Mono',monospace;font-size:11px;color:#5c5847;}

  .bgm-row{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);padding:12px 14px;
  }
  .bgm-row .name{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bgm-row input[type="range"]{width:100px;}
  .btn-ghost{
    border:1px solid var(--ink);background:none;color:var(--ink);
    padding:7px 14px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  .btn-ghost:hover{background:var(--ink);color:var(--paper);}

  .primary-bar{
    position:sticky;bottom:0;
    background:var(--paper);
    border-top:2px solid var(--ink);
    padding:14px 20px;
    margin:0 -20px;
  }
  .primary-bar-inner{max-width:640px;margin:0 auto;}
  .btn-main{
    width:100%;
    background:var(--ink);color:var(--paper);
    border:none;padding:15px;
    font-family:inherit;font-size:15px;font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .btn-main:disabled{background:#a49d87;cursor:not-allowed;}
  .status-line{
    font-family:'Space Mono',monospace;
    font-size:12px;color:#5c5847;
    margin-top:8px;
    min-height:16px;
  }
  .progress{
    height:4px;background:var(--paper-dim);margin-top:6px;overflow:hidden;
  }
  .progress > div{height:100%;background:var(--gold);width:0%;transition:width .2s;}

  .result{
    margin-top:20px;
    text-align:center;
  }
  .result video{
    width:100%;max-width:280px;
    border:1px solid var(--ink);
    background:#000;
  }
  .result a.dl{
    display:inline-block;margin-top:12px;
    background:var(--gold-deep);color:#fff;
    padding:11px 22px;text-decoration:none;
    font-size:14px;font-weight:700;
  }

  .total-dur{
    font-family:'Space Mono',monospace;
    font-size:12px;
    margin-top:10px;
    color:#5c5847;
  }
  .total-dur.warn{color:var(--err);}
  .total-dur.ok{color:var(--ok);}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>商品リール作成</h1>
    <div class="tag">ブラウザ内で処理 / サーバー不使用</div>
  </header>

  <div class="step">
    <div class="step-head">
      <div class="step-num" id="num1">1</div>
      <div class="step-title">動画を選ぶ（3〜5本）</div>
    </div>
    <div class="step-sub">1商品を複数アングルで撮影した短い動画を選んでください</div>
    <div class="step-body">
      <label class="drop" id="drop">
        <input type="file" id="fileInput" accept="video/*" multiple>
        <div>タップして動画を選択</div>
        <div class="hint">またはここにドラッグ＆ドロップ</div>
      </label>
      <div class="clip-list" id="clipList"></div>
      <div class="total-dur" id="totalDur"></div>
    </div>
  </div>

  <div class="step">
    <div class="step-head">
      <div class="step-num" id="num2">2</div>
      <div class="step-title">音声</div>
    </div>
    <div class="step-sub">元動画の音とBGM、必要な方をオンにしてください</div>
    <div class="step-body">
      <div class="bgm-row" style="margin-bottom:12px;">
        <span class="name">動画本来の音を使う</span>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="origAudioToggle">ON
        </label>
      </div>
      <div class="bgm-row">
        <input type="file" id="bgmInput" accept="audio/*" style="display:none">
        <span class="name" id="bgmName">BGM：未選択</span>
        <button class="btn-ghost" id="bgmBtn">選ぶ</button>
      </div>
      <div class="field-row" style="margin-top:10px;">
        <label>BGMの音量：<span class="range-vals" id="bgmVolLabel">60%</span>（動画に流す大きさ。0で無音、100で最大）</label>
        <input type="range" id="bgmVol" min="0" max="100" value="60">
      </div>
    </div>
  </div>

  <div class="step">
    <div class="step-head">
      <div class="step-num" id="num3">3</div>
      <div class="step-title">結合して書き出し</div>
    </div>
    <div class="step-sub">1080×1920（Reels縦型）・15秒目安のmp4を作成します</div>
    <div class="step-body">
      <div id="resultArea"></div>
    </div>
  </div>

</div>

<div class="primary-bar">
  <div class="primary-bar-inner">
    <button class="btn-main" id="buildBtn" disabled>動画をアップロードしてください</button>
    <div class="status-line" id="statusLine"></div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const OUT_W = 1080, OUT_H = 1920;
const TARGET_TOTAL = 15; // seconds, guideline only

let clips = []; // {id, file, url, srcDuration, start, dur, telop}
let bgmFile = null;
let ffmpeg = null;
let ffmpegReady = false;

const clipList = document.getElementById('clipList');
const fileInput = document.getElementById('fileInput');
const drop = document.getElementById('drop');
const totalDurEl = document.getElementById('totalDur');
const buildBtn = document.getElementById('buildBtn');
const statusLine = document.getElementById('statusLine');
const progressBar = document.getElementById('progressBar');
const resultArea = document.getElementById('resultArea');
const bgmInput = document.getElementById('bgmInput');
const bgmBtn = document.getElementById('bgmBtn');
const bgmName = document.getElementById('bgmName');

const origAudioToggle = document.getElementById('origAudioToggle');

const bgmVolInput = document.getElementById('bgmVol');
const bgmVolLabel = document.getElementById('bgmVolLabel');
bgmVolInput.addEventListener('input', () => {
  bgmVolLabel.textContent = bgmVolInput.value + '%';
});

bgmBtn.addEventListener('click', () => bgmInput.click());
bgmInput.addEventListener('change', () => {
  if (bgmInput.files[0]) {
    bgmFile = bgmInput.files[0];
    bgmName.textContent = 'BGM：' + bgmFile.name;
  }
});

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(fileListLike) {
  const files = Array.from(fileListLike).filter(f => f.type.startsWith('video/'));
  for (const f of files) {
    if (clips.length >= 5) break;
    const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const url = URL.createObjectURL(f);
    const clip = { id, file: f, url, srcDuration: 0, start: 0, dur: 3, telop: '', analyzing: true };
    clips.push(clip);
    analyzeClip(clip).then(() => {
      clip.analyzing = false;
      renderClips();
    }).catch(() => {
      clip.analyzing = false;
      clip.dur = Math.min(clip.srcDuration || 3, 4);
      clip.start = 0;
      renderClips();
    });
  }
  fileInput.value = '';
  renderClips();
}

// ---- Auto-trim: pick a stable, low-motion window without any manual UI ----
function seekTo(video, t) {
  return new Promise((resolve) => {
    const onSeeked = () => { video.removeEventListener('seeked', onSeeked); resolve(); };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

async function analyzeClip(clip) {
  const video = document.createElement('video');
  video.src = clip.url;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = resolve;
    video.onerror = () => reject(new Error('load failed'));
  });
  const duration = video.duration || 3;
  clip.srcDuration = duration;

  // Trim off the shaky first/last 0.5s (raising/lowering the camera).
  const pad = 0.5;
  let innerStart = 0, innerEnd = duration;
  if (duration > pad * 2 + 0.4) { innerStart = pad; innerEnd = duration - pad; }
  const usable = Math.max(innerEnd - innerStart, 0.3);
  const targetLen = Math.min(usable, 4);

  if (usable <= targetLen + 0.05) {
    clip.start = innerStart;
    clip.dur = usable;
    return;
  }

  // Slide a window across the clip, sampling a few low-res frames per
  // window, and pick the window with the least frame-to-frame change
  // (i.e. the steadiest, least "moving" segment).
  const canvas = document.createElement('canvas');
  canvas.width = 48; canvas.height = 27;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  async function grabFrame(t) {
    await seekTo(video, Math.min(Math.max(t, 0), duration - 0.02));
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    return ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  }
  function diffScore(a, b) {
    let sum = 0;
    for (let i = 0; i < a.length; i += 4) sum += Math.abs(a[i] - b[i]);
    return sum;
  }

  const step = 0.5;
  const samples = 4;
  let best = { start: innerStart, score: Infinity };
  for (let ws = innerStart; ws + targetLen <= innerEnd + 0.001; ws += step) {
    const frames = [];
    for (let k = 0; k < samples; k++) {
      const t = ws + (targetLen * k) / (samples - 1);
      frames.push(await grabFrame(t));
    }
    let score = 0;
    for (let k = 1; k < frames.length; k++) score += diffScore(frames[k - 1], frames[k]);
    if (score < best.score) best = { start: ws, score };
  }
  clip.start = best.start;
  clip.dur = targetLen;
}


function renderClips() {
  clipList.innerHTML = '';
  clips.forEach((clip, idx) => {
    const row = document.createElement('div');
    row.className = 'clip';
    const durText = clip.analyzing
      ? '解析中…'
      : `アップロードした動画の長さ：${clip.srcDuration.toFixed(1)}秒`;
    row.innerHTML = `
      <video src="${clip.url}" muted preload="metadata"></video>
      <div class="clip-main">
        <div class="clip-title">
          <span>CLIP ${String(idx + 1).padStart(2, '0')}</span>
          <button data-remove="${clip.id}">削除</button>
        </div>
        <div class="field-row">
          <label>テロップ文言</label>
          <input type="text" maxlength="24" placeholder="例）艶やかな質感" data-telop="${clip.id}" value="${clip.telop}">
        </div>
        <div class="range-vals">${durText}</div>
      </div>
    `;
    clipList.appendChild(row);
  });

  clipList.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      clips = clips.filter(c => c.id !== btn.dataset.remove);
      renderClips();
    });
  });
  clipList.querySelectorAll('[data-telop]').forEach(inp => {
    inp.addEventListener('input', () => {
      const c = clips.find(c => c.id === inp.dataset.telop);
      if (c) c.telop = inp.value;
    });
  });

  updateTotal();
  updateStep1Badge();
}

function updateTotal() {
  if (clips.length === 0) { totalDurEl.textContent = ''; buildBtn.disabled = true; buildBtn.textContent = '動画をアップロードしてください'; return; }
  const stillAnalyzing = clips.some(c => c.analyzing);
  const total = clips.reduce((s, c) => s + (c.dur || 0), 0);
  totalDurEl.textContent = stillAnalyzing ? '動画を解析しています…' : `使用予定の合計 約${total.toFixed(1)}秒`;
  const enoughClips = clips.length >= 3 && clips.length <= 5;
  buildBtn.disabled = !enoughClips || stillAnalyzing;
  buildBtn.textContent = stillAnalyzing
    ? '動画を解析しています…'
    : (enoughClips ? '動画を作成する' : 'あと' + (3 - clips.length) + '本、動画を追加してください');
}

function updateStep1Badge() {
  document.getElementById('num1').classList.toggle('done', clips.length >= 3);
}

// ---- Caption image generation (Canvas -> PNG) ----
function makeCaptionPNG(text) {
  const canvas = document.createElement('canvas');
  canvas.width = OUT_W;
  canvas.height = 260;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!text) return canvas;

  ctx.font = "700 64px 'Zen Kaku Gothic New', sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const metrics = ctx.measureText(text);
  const padX = 48, padY = 26;
  const boxW = Math.min(canvas.width - 80, metrics.width + padX * 2);
  const boxH = 64 + padY * 2;

  ctx.fillStyle = 'rgba(20,19,15,0.82)';
  roundRect(ctx, cx - boxW / 2, cy - boxH / 2, boxW, boxH, 6);
  ctx.fill();

  ctx.fillStyle = '#f6f2e9';
  ctx.font = "700 56px 'Zen Kaku Gothic New', sans-serif";
  ctx.fillText(text, cx, cy + 2);

  return canvas;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function canvasToPNGBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// Fetch a URL with byte-level progress and a stall timeout (aborts if no
// new bytes arrive for STALL_MS, so the UI never hangs silently).
const STALL_MS = 25000;
async function fetchWithProgress(url, mimeType, label, onProgress) {
  const controller = new AbortController();
  let stallTimer = null;
  const resetStallTimer = () => {
    clearTimeout(stallTimer);
    stallTimer = setTimeout(() => controller.abort(), STALL_MS);
  };
  resetStallTimer();

  let res;
  try {
    res = await fetch(url, { signal: controller.signal });
  } catch (e) {
    clearTimeout(stallTimer);
    throw new Error(`${label} に接続できませんでした。通信環境をご確認ください。（${url}）`);
  }
  if (!res.ok) {
    clearTimeout(stallTimer);
    throw new Error(`${label} の取得に失敗しました（HTTP ${res.status}）。時間をおいて再度お試しください。`);
  }

  const total = Number(res.headers.get('Content-Length')) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      resetStallTimer();
      onProgress(received, total);
    }
  } catch (e) {
    throw new Error(`${label} のダウンロードが途中で止まりました。通信環境をご確認のうえ再度お試しください。`);
  } finally {
    clearTimeout(stallTimer);
  }
  return new Blob(chunks, { type: mimeType });
}

function fmtMB(bytes) { return (bytes / (1024 * 1024)).toFixed(1); }

// ---- FFmpeg setup ----
async function ensureFFmpeg() {
  if (ffmpegReady) return;
  ffmpeg = new FFmpeg();
  ffmpeg.on('log', ({ message }) => { /* console.log(message); */ });
  ffmpeg.on('progress', ({ progress }) => {
    progressBar.style.width = Math.min(100, Math.round(progress * 100)) + '%';
  });

  const coreBaseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';

  const files = [
    { url: `${coreBaseURL}/ffmpeg-core.js`, mime: 'text/javascript', label: '動画エンジン(1/2)' },
    { url: `${coreBaseURL}/ffmpeg-core.wasm`, mime: 'application/wasm', label: '動画エンジン(2/2・本体約30MB)' },
  ];
  const blobUrls = [];
  for (const f of files) {
    const blob = await fetchWithProgress(f.url, f.mime, f.label, (received, total) => {
      const recvMB = fmtMB(received);
      const totalMB = total ? fmtMB(total) : '?';
      statusLine.textContent = `初回のみ：${f.label}を読み込み中… (${recvMB}MB / ${totalMB}MB)`;
      if (total) progressBar.style.width = Math.min(100, Math.round((received / total) * 100)) + '%';
    });
    blobUrls.push(URL.createObjectURL(blob));
  }

  // classWorkerURL must be same-origin (not a blob of the CDN's worker.js):
  // that worker.js does `import ... from "./const.js"`, and relative imports
  // cannot resolve from inside a blob: URL, which caused a silent, un-erroring
  // hang. We host our own copy of worker.js (+ const.js/errors.js) alongside
  // this page so those relative imports resolve normally over real HTTP.
  const classWorkerURL = new URL('vendor/worker.js', location.href).href;

  statusLine.textContent = '動画エンジンを起動中…';
  const startupTimer = setTimeout(() => {
    statusLine.textContent = '起動に時間がかかっています…（このまま数十秒お待ちください）';
  }, 8000);
  try {
    await Promise.race([
      ffmpeg.load({
        coreURL: blobUrls[0],
        wasmURL: blobUrls[1],
        classWorkerURL,
      }),
      new Promise((_, reject) => setTimeout(
        () => reject(new Error('動画エンジンの起動が60秒たっても完了しませんでした。ページを再読み込みして、もう一度お試しください。')),
        60000
      )),
    ]);
  } finally {
    clearTimeout(startupTimer);
  }
  ffmpegReady = true;
}


buildBtn.addEventListener('click', runBuild);

async function runBuild() {
  buildBtn.disabled = true;
  resultArea.innerHTML = '';
  progressBar.style.width = '0%';
  try {
    await ensureFFmpeg();

    // Write source clips
    for (let i = 0; i < clips.length; i++) {
      statusLine.textContent = `素材を準備中… (${i + 1}/${clips.length})`;
      const c = clips[i];
      const data = await fetchFile(c.file);
      await ffmpeg.writeFile(`src${i}.mp4`, data);
    }

    // Write caption PNGs
    const captionFiles = [];
    for (let i = 0; i < clips.length; i++) {
      const c = clips[i];
      if (c.telop && c.telop.trim()) {
        const canvas = makeCaptionPNG(c.telop.trim());
        const blob = await canvasToPNGBlob(canvas);
        const buf = new Uint8Array(await blob.arrayBuffer());
        await ffmpeg.writeFile(`cap${i}.png`, buf);
        captionFiles.push(i);
      }
    }

    // Trim + scale/crop each clip to OUT_W x OUT_H, overlay its caption (centered)
    statusLine.textContent = '各カットを整形中…';
    const CAPTION_H = 260;
    const segmentFiles = [];
    for (let i = 0; i < clips.length; i++) {
      const c = clips[i];
      const outName = `seg${i}.mp4`;
      const args = [
        '-ss', String(c.start),
        '-i', `src${i}.mp4`,
        '-t', String(c.dur),
      ];
      let filter = `[0:v]scale=${OUT_W}:${OUT_H}:force_original_aspect_ratio=increase,crop=${OUT_W}:${OUT_H},setsar=1,fps=30[base]`;
      if (captionFiles.includes(i)) {
        args.push('-i', `cap${i}.png`);
        const capY = Math.round((OUT_H - CAPTION_H) / 2);
        filter += `;[base][1:v]overlay=0:${capY}[v]`;
      } else {
        filter += `;[base]null[v]`;
      }
      args.push('-filter_complex', filter, '-map', '[v]');
      args.push('-an'); // video-only; audio is built as a separate track below
      args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-pix_fmt', 'yuv420p', outName);
      await ffmpeg.exec(args);
      segmentFiles.push(outName);
    }

    // Concat video-only
    statusLine.textContent = 'カットをつなげています…';
    const listContent = segmentFiles.map(f => `file '${f}'`).join('\n');
    await ffmpeg.writeFile('list.txt', new TextEncoder().encode(listContent));

    // ---- Audio track (built separately so mismatched/missing source audio
    // never breaks the video concat) ----
    const useOrigAudio = origAudioToggle.checked;
    let audioTrackReady = false;

    if (useOrigAudio) {
      statusLine.textContent = '元動画の音声を準備中…';
      const audioSegFiles = [];
      for (let i = 0; i < clips.length; i++) {
        const c = clips[i];
        const segName = `aud${i}.m4a`;
        try {
          await ffmpeg.exec([
            '-ss', String(c.start), '-i', `src${i}.mp4`, '-t', String(c.dur),
            '-vn', '-c:a', 'aac', '-ar', '44100', '-ac', '2', segName,
          ]);
        } catch (e) {
          // This clip has no audio track (or it's unreadable) — fill with silence
          // so the timing of every clip's audio still lines up.
          await ffmpeg.exec([
            '-f', 'lavfi', '-i', 'anullsrc=r=44100:cl=stereo', '-t', String(c.dur),
            '-c:a', 'aac', segName,
          ]);
        }
        audioSegFiles.push(segName);
      }
      const audioListContent = audioSegFiles.map(f => `file '${f}'`).join('\n');
      await ffmpeg.writeFile('audiolist.txt', new TextEncoder().encode(audioListContent));
      await ffmpeg.exec(['-f', 'concat', '-safe', '0', '-i', 'audiolist.txt', '-c', 'copy', 'orig_audio.m4a']);
      audioTrackReady = true;
    }

    let bgmData = null;
    if (bgmFile) {
      statusLine.textContent = 'BGMを準備中…';
      bgmData = await fetchFile(bgmFile);
      await ffmpeg.writeFile('bgm_src', bgmData);
    }

    let finalAudioFile = null;
    if (audioTrackReady && bgmFile) {
      const vol = document.getElementById('bgmVol').value / 100;
      await ffmpeg.exec([
        '-i', 'orig_audio.m4a', '-i', 'bgm_src',
        '-filter_complex', `[1:a]volume=${vol}[bgmv];[0:a][bgmv]amix=inputs=2:duration=first:dropout_transition=0[a]`,
        '-map', '[a]', '-c:a', 'aac', '-b:a', '128k', 'final_audio.m4a',
      ]);
      finalAudioFile = 'final_audio.m4a';
    } else if (audioTrackReady) {
      finalAudioFile = 'orig_audio.m4a';
    } else if (bgmFile) {
      const vol = document.getElementById('bgmVol').value / 100;
      await ffmpeg.exec([
        '-i', 'bgm_src', '-filter_complex', `[0:a]volume=${vol}[a]`,
        '-map', '[a]', '-c:a', 'aac', '-b:a', '128k', 'final_audio.m4a',
      ]);
      finalAudioFile = 'final_audio.m4a';
    }

    // Mux video + (optional) audio
    statusLine.textContent = '書き出し中…';
    const muxArgs = ['-f', 'concat', '-safe', '0', '-i', 'list.txt'];
    if (finalAudioFile) {
      muxArgs.push('-i', finalAudioFile);
      muxArgs.push('-map', '0:v', '-map', '1:a', '-shortest');
      muxArgs.push('-c:v', 'copy', '-c:a', 'aac', '-b:a', '128k');
    } else {
      muxArgs.push('-map', '0:v', '-c:v', 'copy');
    }
    muxArgs.push('output.mp4');
    await ffmpeg.exec(muxArgs);

    const outData = await ffmpeg.readFile('output.mp4');
    const blob = new Blob([outData.buffer], { type: 'video/mp4' });
    const outUrl = URL.createObjectURL(blob);

    resultArea.innerHTML = `
      <div class="result">
        <video src="${outUrl}" controls playsinline></video><br>
        <a class="dl" href="${outUrl}" download="reel.mp4">動画をダウンロード</a>
      </div>
    `;
    statusLine.textContent = '完成しました。ダウンロードしてInstagramにアップロードしてください。';
    progressBar.style.width = '100%';
  } catch (err) {
    console.error(err);
    statusLine.textContent = 'エラーが発生しました: ' + (err && err.message ? err.message : String(err));
  } finally {
    buildBtn.disabled = false;
  }
}

renderClips();
</script>
</body>
</html>
